name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm registry:fresh
      - run: git diff --exit-code -- registry.json src/lib/registry/__index__.ts
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test:unit --run
      - run: pnpm build
      - run: pnpm test:e2e
